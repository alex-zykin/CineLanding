[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinelanding"
version = "0.2.0"
description = "CLI and agent workflow for landing pages with cinematic scroll-linked transitions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Alex Zykin" }]
dependencies = []

[project.urls]
Homepage = "https://cinelanding.ru"
Repository = "https://github.com/alex-zykin/CineLanding"

[project.scripts]
cinelanding = "cinelanding.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
